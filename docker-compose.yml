x-airflow-common:
  &airflow-common
  build: .
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    
    # APIs existentes
    DSPACE_API_URL: ${DSPACE_API_URL:-}
    DSPACE_API_EMAIL: ${DSPACE_API_EMAIL:-}
    DSPACE_API_PASSWORD: ${DSPACE_API_PASSWORD:-}
    RENACYT_API_TOKEN: ${RENACYT_API_TOKEN:-}
    SISMO_API_URL: ${SISMO_API_URL:-}

    # 🚀 AGREGAR ESTO: Variables de SISMO
    SISMO_HOST: ${SISMO_HOST:-172.17.0.1}
    SISMO_PORT: ${SISMO_PORT:-5431}
    SISMO_DB: ${SISMO_DB:-}
    SISMO_USER: ${SISMO_USER:-}
    SISMO_PASSWORD: ${SISMO_PASSWORD:-}

    # 🚀 AGREGAR ESTO: Variables de SIRI
    SIRI_HOST: ${SIRI_HOST:-172.17.0.1}
    SIRI_PORT: ${SIRI_PORT:-3307}
    SIRI_DB: ${SIRI_DB:-}
    SIRI_USER: ${SIRI_USER:-}
    SIRI_PASSWORD: ${SIRI_PASSWORD:-}
    SIRI_ACTIVE_SEMESTER_ID: ${SIRI_ACTIVE_SEMESTER_ID:-}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./data:/opt/airflow/data
    - ./config:/opt/airflow/config
    - ./sql:/opt/airflow/sql
    - ./scripts:/opt/airflow/scripts
    - ./tests:/opt/airflow/tests
    - ./tools:/opt/airflow/tools
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    ports:
      - "5433:5432"

  airflow-init:
    <<: *airflow-common
    command: version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_UPGRADE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-admin}

  airflow-webserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-db-volume: {}